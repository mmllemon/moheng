name: One-shot dependency lock refresh (Prisma 7 RC)

on:
  push:
    branches: [feat/v2.19.0-rc.2-prisma7]
    paths:
      - package.json
      - apps/api/package.json
      - apps/web/package.json
      - .github/workflows/refresh-prisma7-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.ref == 'refs/heads/feat/v2.19.0-rc.2-prisma7'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2.19.0-rc.2-prisma7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Re-resolve lockfile using Node 24 npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Seal exact lockfile hash and verify a clean install
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const lock = await readFile('package-lock.json');
          const hash = createHash('sha256').update(lock).digest('hex');
          const path = 'scripts/validate-source-bundle-completeness.mjs';
          let source = await readFile(path, 'utf8');
          const pattern = /const expectedSha256 = '[0-9a-f]{64}';/;
          if (!pattern.test(source)) throw new Error('Could not find the expected lockfile hash declaration');
          source = source.replace(pattern, `const expectedSha256 = '${hash}';`);
          await writeFile(path, source);
          console.log(`Sealed package-lock.json SHA-256: ${hash}`);
          NODE
          npm ci --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          git diff --check
      - name: Commit generated lockfile and matching hash seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json scripts/validate-source-bundle-completeness.mjs
          if git diff --cached --quiet; then
            echo "Lockfile and seal are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for dependency security hardening"
          git push origin HEAD:refs/heads/feat/v2.19.0-rc.2-prisma7
