name: Prisma 7 migration gates

on:
  push:
    branches: [feat/v2.19.0-rc.2-prisma7]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  prisma7-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moheng_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moheng_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moheng_test?schema=public
      PRODUCTION_DATABASE_URL: postgresql://production.invalid/never-use
      ASSISTANT_RECOVERY_TESTS: 'true'
      ASSISTANT_GATE_ARTIFACT_DIR: ${{ github.workspace }}/.assistant-gate-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require committed root lockfile
        run: test -f package-lock.json
      - name: Install reproducibly and verify lockfile stability
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum package-lock.json | awk '{print tolower($1)}')"
          npm ci --no-audit --no-fund
          ACTUAL="$(sha256sum package-lock.json | awk '{print tolower($1)}')"
          test "$EXPECTED" = "$ACTUAL"
          npm ci --no-audit --no-fund
          ACTUAL_SECOND="$(sha256sum package-lock.json | awk '{print tolower($1)}')"
          test "$EXPECTED" = "$ACTUAL_SECOND"
          printf 'lockfile-sha256=%s\n' "$ACTUAL_SECOND" | tee lockfile-sha256.txt
      - name: Validate Prisma schema and apply migrations to isolated PostgreSQL
        run: |
          npm run db:validate
          npm run db:deploy
      - name: Seed disposable fixtures and rehearse PostgreSQL backup/restore
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          BACKUP_RESTORE_REPORT_PATH: gate-artifacts/postgres-backup-restore.txt
        run: |
          set -euo pipefail
          mkdir -p "$ASSISTANT_GATE_ARTIFACT_DIR" gate-artifacts
          npm run db:generate
          SMOKE_ADMIN_PASSWORD="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('base64url'))")"
          echo "::add-mask::$SMOKE_ADMIN_PASSWORD"
          echo "SMOKE_ADMIN_PASSWORD=$SMOKE_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          NODE_ENV=test SEED_DEMO_DATA=true SEED_ADMIN_EMAIL=gate.admin@moheng.invalid SEED_ADMIN_PASSWORD="$SMOKE_ADMIN_PASSWORD" SEED_ADMIN_NAME="CI Backup Restore Gate" npm run seed -w @cms/api
          bash scripts/verify-postgres-backup-restore.sh
      - name: Build
        run: npm run build
      - name: Live API smoke tests against isolated PostgreSQL
        shell: bash
        env:
          API_SMOKE_PORT: '3181'
          SMOKE_ADMIN_EMAIL: gate.admin@moheng.invalid
        run: |
          set -euo pipefail
          node scripts/verify-api-smoke.mjs
      - name: API unit tests
        run: npm test
      - name: Assistant contracts and PostgreSQL recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ASSISTANT_GATE_ARTIFACT_DIR"
          npm run test:assistant-runtime-contracts
          npx tsx --test apps/api/src/lib/assistant-event-safety.test.ts apps/api/src/assistant/runtime/langgraph-adapter.test.ts
          npm run test:assistant-recovery:postgres -w @cms/api 2>&1 | tee "$ASSISTANT_GATE_ARTIFACT_DIR/assistant-runtime.log"
          node scripts/validate-assistant-leaks.mjs \
            --logs "$ASSISTANT_GATE_ARTIFACT_DIR/assistant-runtime.log" \
            --events "$ASSISTANT_GATE_ARTIFACT_DIR/assistant-events.jsonl" \
            --markers "$ASSISTANT_GATE_ARTIFACT_DIR/assistant-forbidden-markers.txt"
      - name: Complete release-candidate gates
        run: npm run validate:release-candidate
      - name: Audit dependencies and block on Critical or High
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const audit = JSON.parse(await readFile('npm-audit.json', 'utf8'));
          if (!audit.metadata?.vulnerabilities) throw new Error('npm audit did not return vulnerability metadata');
          const v = audit.metadata.vulnerabilities;
          console.log(JSON.stringify({ vulnerabilities: v }, null, 2));
          if ((v.critical ?? 0) > 0 || (v.high ?? 0) > 0) process.exitCode = 1;
          NODE
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma7-pr-gates
          if-no-files-found: warn
          path: |
            lockfile-sha256.txt
            npm-audit.json
            .assistant-gate-artifacts/
            gate-artifacts/postgres-backup-restore.txt

  legacy-data-migration-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moheng_upgrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moheng_upgrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/moheng_upgrade_test?schema=public
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      LEGACY_MIGRATION_REPORT_PATH: .assistant-gate-artifacts/legacy-migration-upgrade.txt
      ASSISTANT_GATE_ARTIFACT_DIR: ${{ github.workspace }}/.assistant-gate-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Rehearse migrations with populated legacy-shaped data
        run: |
          set -euo pipefail
          mkdir -p "$ASSISTANT_GATE_ARTIFACT_DIR"
          node scripts/rehearse-legacy-data-migration.mjs
      - name: Rehearse STG-shaped reconciliation in a guarded isolated schema
        shell: bash
        env:
          STAGING_RECONCILIATION_ALLOW_RESET: 'YES'
          STAGING_RECONCILIATION_REPORT_PATH: .assistant-gate-artifacts/staging-data-migration-reconciliation-ci.txt
        run: |
          set -euo pipefail
          mkdir -p "$ASSISTANT_GATE_ARTIFACT_DIR"
          node scripts/gates/staging-fixtures/rehearse.mjs --reset-isolated-schema
      - name: Upload legacy migration upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prisma7-legacy-upgrade-evidence
          if-no-files-found: warn
          path: |
            .assistant-gate-artifacts/legacy-migration-upgrade.txt
            .assistant-gate-artifacts/staging-data-migration-reconciliation-ci.txt
