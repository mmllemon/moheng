name: Source gates

# 分级门禁：blocking 必须通过，advisory 持续可见但不拦 PR。
# 分级依据与债务原因写在 scripts/run-gates.mjs 的 GATES 表里（tier / reason），
# 汇总在 docs/门禁债务清单.md。升 tier 只改 GATES 里那一行，让分级决定留在可评审的代码里。

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  blocking-gates:
    name: Blocking gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 已实测：全部 blocking 门禁在不可达的 DATABASE_URL 下同样全绿（条数见 run-gates.mjs，
      # 说明它们不连库。这里仍显式钉一个占位值，是为了让 apps/api/.env（CI 里不存在）
      # 不参与解释，同一份代码在本地与 CI 得出同一结论。
      DATABASE_URL: postgresql://ci.invalid:5432/ci_placeholder?schema=public
      # AI 助手 PoC 开关会改变源码与测试的判定路径，显式钉成生产默认（关闭），
      # 避免"本地开着 .env、CI 没开"导致同一提交两种结论。
      ASSISTANT_POC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require committed root package lock
        run: test -f package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client (imported by code under test)
        run: npm run db:generate
      - name: Run blocking gates
        run: node scripts/run-gates.mjs --tier blocking --capture

  advisory-gates:
    name: Advisory gates (known debt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 这批门禁在基线 3feb702 就已红（既有债，非本轮拆分引入，条数见清单）。先让它们在 CI 里
    # 持续可见：不拦 PR，但每次运行都输出债务明细，修绿一条就把该 gate 的 tier 升为 blocking。
    continue-on-error: true
    env:
      DATABASE_URL: postgresql://ci.invalid:5432/ci_placeholder?schema=public
      ASSISTANT_POC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require committed root package lock
        run: test -f package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client (imported by code under test)
        run: npm run db:generate
      - name: Run advisory gates (non-blocking)
        run: node scripts/run-gates.mjs --tier advisory --capture

  db-integration:
    name: Database migrations and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 前两张 job 都刻意不连库（占位 DATABASE_URL），所以「迁移没应用」
    # 「迁移与 schema.prisma 不相等」这类问题在 PR 阶段看不见。
    # 2026-10-29 就是这么漏的：运行库少一条迁移，全站接口 500。
    # 这个 job 用真实 PostgreSQL 把迁移链跑一遍，并跑两个 PG 集成套件。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moheng
          POSTGRES_PASSWORD: moheng
          POSTGRES_DB: moheng_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moheng -d moheng_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://moheng:moheng@127.0.0.1:5432/moheng_ci?schema=public
      ASSISTANT_POC_ENABLED: 'false'
      REPORT_STUDIO_DATA_TESTS: 'true'
      ASSISTANT_RECOVERY_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require committed root package lock
        run: test -f package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply every migration to an empty database
        run: npm run prisma:deploy -w @cms/api
      - name: Assert no migration is left pending
        working-directory: apps/api
        run: npx prisma migrate status
      - name: Assert migrations reproduce schema.prisma exactly
        working-directory: apps/api
        # Prisma 7 已移除 --from-url，改用 config 里的 datasource；选项也改名为 --to-schema。
        # --exit-code：空差异 0、有差异 2、出错 1，把「迁移链与 schema 漂移」变成硬失败。
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Report Studio data integration (real PostgreSQL)
        run: npm run test:report-studio-data:postgres -w @cms/api
      - name: Assistant recovery integration (real PostgreSQL)
        run: npm run test:assistant-recovery:postgres -w @cms/api
