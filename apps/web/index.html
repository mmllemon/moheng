<!doctype html>
<html lang="zh-CN" data-theme="warm-paper" data-paper-texture="rice">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f4ed" />
    <link rel="icon" type="image/svg+xml" href="/moheng-mark.svg" />
    <meta name="description" content="施工单位项目成本与合同管理工作台" />
    <title>墨衡 · 工程经营管理</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("moheng:ui-preferences");
          var prefs = raw ? JSON.parse(raw) : {};
          var theme = prefs.theme === "plain-white" || prefs.theme === "midnight" ? prefs.theme : "warm-paper";
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.density = prefs.density === "compact" ? "compact" : "comfortable";
          document.documentElement.dataset.motion = prefs.reduceMotion ? "reduced" : "full";
          document.documentElement.dataset.contentWidth = prefs.wideContent ? "wide" : "standard";
          var texture = prefs.paperTexture === "off" || prefs.paperTexture === "cotton" || prefs.paperTexture === "fine" ? prefs.paperTexture : "rice";
          if (texture === "off") document.documentElement.removeAttribute("data-paper-texture");
          else document.documentElement.dataset.paperTexture = texture;
          var strength = Number(prefs.paperTextureStrength);
          if (!isFinite(strength)) strength = 1;
          strength = Math.min(1.5, Math.max(0.5, strength));
          document.documentElement.style.setProperty("--paper-texture-strength", String(strength));
        } catch (error) { /* Default theme remains warm paper. */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
