# 可选部署方式。Windows 原生部署请优先参考 docs/开发维护指南.md。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cost_management}
      POSTGRES_USER: ${POSTGRES_USER:-cms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms_user} -d ${POSTGRES_DB:-cost_management}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cost_management}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-系统管理员}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@local.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      EVIDENCE_STORAGE_DIR: ${EVIDENCE_STORAGE_DIR:-/app/apps/api/data/evidence}
      BACKGROUND_WORKER_ENABLED: ${BACKGROUND_WORKER_ENABLED:-true}
      BACKGROUND_JOB_POLL_MS: ${BACKGROUND_JOB_POLL_MS:-1000}
      BACKGROUND_JOB_STORAGE_DIR: ${BACKGROUND_JOB_STORAGE_DIR:-/app/apps/api/data/jobs}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      PG_DUMP_PATH: ${PG_DUMP_PATH:-pg_dump}
      PG_RESTORE_PATH: ${PG_RESTORE_PATH:-pg_restore}
      PSQL_PATH: ${PSQL_PATH:-psql}
      RESTORE_TEST_DATABASE_URL: ${RESTORE_TEST_DATABASE_URL:-}
    volumes:
      - evidence-data:/app/apps/api/data/evidence
      - job-data:/app/apps/api/data/jobs
      - backup-data:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  restore-test:
    profiles: ["restore-test"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RESTORE_TEST_POSTGRES_DB:-cost_management_restore_test}
      POSTGRES_USER: ${POSTGRES_USER:-cms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-restore-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms_user} -d ${RESTORE_TEST_POSTGRES_DB:-cost_management_restore_test}"]
      interval: 5s
      timeout: 3s
      retries: 20

  background-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/api
    command: ["node", "dist/src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cost_management}?schema=public
      BACKGROUND_JOB_POLL_MS: ${BACKGROUND_JOB_POLL_MS:-1000}
      BACKGROUND_JOB_STORAGE_DIR: ${BACKGROUND_JOB_STORAGE_DIR:-/app/apps/api/data/jobs}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - job-data:/app/apps/api/data/jobs
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  evidence-data:
  job-data:
  backup-data:
  postgres-restore-test-data:
